<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stones in Drift</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      background: #1e2430;
      color: #e6e6e6;
    }

    h1 {
      font-weight: 600;
      font-size: 3.2rem;
      letter-spacing: 1px;
      opacity: 0.24;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.05rem;
      color: #c9ced6;
      opacity: 0.9;
    }

    .word {
      display: inline-block;
      min-width: 6ch;
      padding-left: 6px;
      color: #bfa06a;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .enter-link {
      opacity: 0.4;
      font-size: 14px;
      transition: opacity 0.3s ease;
    }

    .enter-link:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <h1>Stones in Drift</h1>
  <p>
    Reflections through one thousand games of<span class="word" id="word"></span>
  </p>

  <div style="margin-top: 24px;">
    <a href="entries.html" style="opacity:0.5; font-size:14px;">
      enter
    </a>
  </div>

  <script>

    const words = ["weiqi", "igo", "baduk", "go"];
    let index = 0;
    const el = document.getElementById("word");

    function updateWord() {
      el.style.opacity = 0;

      setTimeout(() => {
        index = (index + 1) % words.length;
        el.textContent = words[index];
        el.style.opacity = 1;
        // wait before next cycle
        setTimeout(updateWord, 2000);
      }, 500);

    }

    // initial state
    el.textContent = words[0];
    el.style.opacity = 1;

    setTimeout(updateWord, 2000);

  </script>
</body>
</html>
