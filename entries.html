<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entries — Stones in Drift</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: #f4f1ea; /* warm off-white */
      color: #222;
      font-family: 'Inter', sans-serif;
      max-width: 1200px;
      margin: auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 40px;
    }

    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    p {
      line-height: 1.7;
      margin-bottom: 22px;
      font-weight: 300;
    }

    strong {
      font-weight: 800;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .site-title {
      padding-bottom: 50px;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: #888;
    }

    .sidebar {
      background: transparent;
      width: 200px;
      flex-shrink: 0;
      font-family: Inter, system-ui, sans-serif;
      padding: 50px 20px;
      color: #cfd6dd;
      width: 220px;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid #eee;
      border-radius: 2px;
    }

    .main {
      padding: 40px 50px;
    }

    .main article {
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;
      margin-left: 20px;
    }

    .entry-link {
      display: block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #111;
    }

    .entry-link .title {
      font-size: 14px;
    }

    .entry-link .date {
      font-size: 12px;
      color: #777;
    }

    a {
      color: #2a5db0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>

</head>

<body>

  <div class="container">
    <div class="sidebar">
    <div class="site-title">stones in drift</div>

    <div class="date">2026</div>
    <a href="entries/about.html" class="entry-link" onclick="handleClick(event, this.href)">
      <div class="title">before the first 19x19</div>
      <div class="date">feb 10</div>
    </a>

    <a href="entries/game1.html" class="entry-link" onclick="handleClick(event, this.href)">
      <div class="title">games 1-9 | ummm can I have infinite time please?</div>
      <div class="date">Feb 28</div>
    </a>

    <a href="entries/entry1.html" class="entry-link" onclick="handleClick(event, this.href)">
      <div class="title">template</div>
      <div class="date"></div>
    </a>

    </div>

    <div class="main" id="content">
      <!-- blog content loads here -->
    </div>

  </div>

  <script>
    function loadEntry(url) {
      event.preventDefault();
      fetch(url)
        .then(res => res.text())
        .then(html => {
          document.getElementById("content").innerHTML = html;
        });
    }

    function handleClick(event, url) {
      event.preventDefault();
      loadEntry(url);
    }

    // load first entry automatically
    window.onload = function () {
      loadEntry("entries/about.html");
    };
  </script>
</body>
</html>
